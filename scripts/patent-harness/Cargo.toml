# Reference harness: runs patent's library functions on fixed inputs, so the
# Go port can be compared against them. It writes testdata/patent:
#
#   cd scripts/patent-harness
#   cargo run --release -- prompt        ../../testdata/patent/fixture.json > ../../testdata/patent/prompt.txt
#   cargo run --release -- from-data     ../../testdata/patent/fixture.json > ../../testdata/patent/from-data.json
#   cargo run --release -- rank-keywords ../../testdata/patent/fixture.json > ../../testdata/patent/rank-keywords.json
#
# Then update patenttest.Now to the time prompt.txt was generated at.
[package]
name = "patent-harness"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# The port's reference commit (patent 0.14.1).
patent = { git = "https://github.com/r14dd/patent", rev = "8d741bd273306a4f2cb20a9583a1a94b19546255" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
