# Release binaries, built by .github/workflows/release.yml for a v* tag.
# Try it locally with: goreleaser release --snapshot --clean
version: 2

builds:
  - main: ./cmd/silt
    env:
      # Pure Go, so the binaries are static.
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/miku/silt.version={{ .Version }}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - NOTICE
      - README.md
      - CHANGELOG.md

checksum:
  name_template: checksums.txt

# The notes come from CHANGELOG.md, not from the commit messages.
changelog:
  disable: true

release:
  # Published by hand, after a look at the notes and the archives.
  draft: true
