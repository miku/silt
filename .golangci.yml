version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - misspell
    - nilerr
    - noctx
    - unconvert
  settings:
    errcheck:
      exclude-functions:
        # Writes to an http.ResponseWriter in test handlers.
        - (net/http.ResponseWriter).Write
  exclusions:
    presets:
      - std-error-handling

formatters:
  enable:
    - gofmt
